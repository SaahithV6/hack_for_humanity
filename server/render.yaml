services:
  - type: web
    name: moth-enrichment
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set the key for whichever provider you are using in the Render
      # dashboard. This service exists precisely so the key is not in the app,
      # where anyone could extract it from the bundle.
      #
      # The provider is chosen by whichever key is present:
      #   GEMINI_API_KEY    -> Gemini (has a genuinely free tier)
      #   CEREBRAS_API_KEY  -> Cerebras (fastest; $5 trial, needs a card)
      #   ANTHROPIC_API_KEY -> Claude
      # Set PROVIDER explicitly to override.
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
